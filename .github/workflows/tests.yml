name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          echo "Coverage of tested logic modules (src/lib/utils.ts, stripe.ts, store.ts, types.ts):"
          npx vitest run --coverage --reporter=dot 2>/dev/null | grep -E "Statements|Branches|Functions|Lines" || true
